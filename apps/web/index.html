<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1220" />
    <meta
      name="description"
      content="Capflow — единый слой управления капиталом в DeFi. Структура, доходность и риски в одном экране."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Capflow — Control your capital flow</title>
    <script>
      // No-flash theme bootstrap: применяем сохранённую тему до первого рендера
      (function () {
        try {
          var saved = localStorage.getItem("capflow.theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          var resolved =
            saved === "light"
              ? "light"
              : saved === "dark"
              ? "dark"
              : saved === "system"
              ? prefersDark
                ? "dark"
                : "light"
              : "dark"; /* default */
          var root = document.documentElement;
          root.classList.toggle("dark", resolved === "dark");
          root.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
